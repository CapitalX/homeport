name: shellcheck

# The deploy and pipeline scripts are most of the code CI never executes, and
# where most of the real bugs have been. Enforced at every severity; any
# exception is a documented `# shellcheck disable=` in the script itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S style build.sh deploy/*.sh pipeline/*.sh scripts/*.sh
