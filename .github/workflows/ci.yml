name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The tests need no Apple framework access -- classifier, trust table,
    # handle normalization, audit redaction, scheduling -- so they need no TCC
    # grant and no signed bundle. Anything requiring a real permission grant lives in
    # pipeline/selftest.sh, which needs a provisioned Mac and is not run here.
    #
    # macos-26, not macos-15: LocalTranscriber uses SpeechAnalyzer and
    # SpeechTranscriber, which exist only in the macOS 26 SDK. The
    # `#available(macOS 26.0, *)` guards keep the binary running on macOS 14,
    # but they cannot make the symbols compile against an older SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: A stock build knows nothing about anyone
        # The debug binary with no config must expose no voice-memo categories.
        # See CLAUDE.md § "Verify a stock build knows nothing".
        run: |
          got=$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | HOMEPORT_NO_DISCLAIM=1 HOMEPORT_RAW=1 ./.build/debug/Homeport 2>/dev/null \
            | python3 -c 'import json,sys
          for l in sys.stdin:
              if l.startswith("{"):
                  m=json.loads(l)
                  if m.get("id")==2:
                      t=[t for t in m["result"]["tools"] if t["name"]=="voicememos_list"][0]
                      print(t["inputSchema"]["properties"]["category"]["enum"])')
          echo "categories: $got"
          test "$got" = "['unknown']"
