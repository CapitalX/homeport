name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The tests need no Apple framework access -- classifier, trust table,
    # handle normalization, audit redaction, scheduling -- so they need no TCC
    # grant and no signed bundle. Anything requiring a real permission grant lives in
    # pipeline/selftest.sh, which needs a provisioned Mac and is not run here.
    #
    # macos-26, not macos-15: LocalTranscriber uses SpeechAnalyzer and
    # SpeechTranscriber, which exist only in the macOS 26 SDK. The
    # `#available(macOS 26.0, *)` guards keep the binary running on macOS 14,
    # but they cannot make the symbols compile against an older SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
